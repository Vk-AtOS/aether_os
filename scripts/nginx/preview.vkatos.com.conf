# AetherOS — preview.vkatos.com
# Generated apps, on an origin of their own (gateway/preview_server.py on 127.0.0.1:8100).
# Needs: DNS A record for preview.vkatos.com, certbot --nginx -d preview.vkatos.com,
# AETHER_PREVIEW_ORIGIN=https://preview.vkatos.com in the API and preview server env.
# Never add this origin to the API's CORS_ORIGINS.

server {
    listen 80;
    server_name preview.vkatos.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name preview.vkatos.com;

    ssl_certificate     /etc/letsencrypt/live/preview.vkatos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.vkatos.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # CSP (frame-ancestors = the dashboard), COOP and CORP come from the preview server.
    location / {
        proxy_pass         http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Api-Key "";
        proxy_set_header   X-Org-Id "";
        proxy_read_timeout 120s;
    }
}
