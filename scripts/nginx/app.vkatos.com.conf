# AetherOS — app.vkatos.com
# Proxies to AetherOS backend running on port 8000 via docker-compose.

server {
    listen 80;
    server_name app.vkatos.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.vkatos.com;

    ssl_certificate     /etc/letsencrypt/live/app.vkatos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vkatos.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # SSE — disable buffering so events arrive immediately
    location /api/runs/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
    }

    # WebSocket upgrade for real-time run logs
    location /ws/ {
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;
    }

    # Generated apps are never served on the dashboard origin (see preview.vkatos.com.conf).
    location /app-preview/ {
        return 307 https://preview.vkatos.com$request_uri;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
