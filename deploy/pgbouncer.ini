[databases]
; AetherOS production database.
; Replace "aetheros" with your actual PostgreSQL database name.
aetheros = host=127.0.0.1 port=5432 dbname=aetheros

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type    = scram-sha-256
auth_file    = /etc/pgbouncer/userlist.txt

; Transaction-mode pooling — safe for SQLAlchemy async, required for Alembic migrations.
pool_mode    = transaction
max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3

; Keep idle connections alive so the first request after quiet periods is fast.
server_idle_timeout = 600
client_idle_timeout = 0

; Log connections in development; silence them in production to avoid I/O overhead.
log_connections = 0
log_disconnections = 0

; Admin interface — restrict to localhost.
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin

; Required: point at your PostgreSQL unix socket or TCP host.
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
