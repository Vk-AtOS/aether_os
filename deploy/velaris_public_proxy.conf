# Shared by every allowed location of deploy/nginx_velaris_public.conf (installed to /etc/nginx/velaris_public_proxy.conf).
limit_except GET HEAD POST OPTIONS { deny all; }
limit_req zone=vpub burst=30 nodelay;
limit_req_status 429;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;          # replace, never append: the client controls what it sent
proxy_set_header X-Forwarded-Proto $scheme;
# credentials never reach the public process, whatever the browser or an attacker sends
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header X-Api-Key "";
proxy_set_header X-Org-Id "";
proxy_set_header X-Velaris-Identity "";
proxy_set_header X-Velaris-Signature "";
proxy_set_header X-Velaris-Timestamp "";
proxy_set_header X-Velaris-Nonce "";
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
