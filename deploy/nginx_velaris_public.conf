# Velaris PUBLIC app (careers, candidate self-scheduling, interview participant, e-sign): KAN-128.
# Own process (python3.11 -m velaris.api.public, 127.0.0.1:8731), own host name, own certificate. It is NOT the
# Velaris API (8730, signed calls from AetherOS only) and must never share a host with the dashboard.
#
# Install (owner, once):  bash deploy/velaris_public_setup.sh public.example.com
#   -> replaces VELARIS_PUBLIC_DOMAIN_PLACEHOLDER, installs as /etc/nginx/sites-available/velaris-public.
# This file is an http-context fragment like deploy/nginx.conf (no events{} / http{} here).
#
# Rules this file enforces (the app documents them in velaris/api/public.py):
#   * exact path allowlist: /careers/ /schedule/ /interview/ /sign/ ; every other path on this host is 404
#     (/agents /flows /chat /mail /control never exist here);
#   * request headers that carry credentials are dropped (Cookie, Authorization, X-Velaris-*, X-Api-Key, X-Org-Id);
#   * X-Forwarded-For is set to the connection address, replacing anything the client sent, so the app (run with
#     VELARIS_PUBLIC_TRUST_PROXY=1, behind exactly this one proxy) rate-limits the real client IP;
#   * the access log never contains a token: the path is cut after its first segment and the query string and
#     Referer are not logged at all (a token lives in the path or query).

limit_req_zone $binary_remote_addr zone=vpub:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=vpub_conn:10m;

upstream velaris_public_backend {
    server 127.0.0.1:8731;
    keepalive 16;
}

# /sign/TOKEN/x?y=1 -> /sign/***   ;  anything else -> /***   (the first segment is a fixed word, never a token)
map $uri $vpub_log_path {
    ~^(?<vpub_seg>/(careers|schedule|interview|sign))(/|$)   "$vpub_seg/***";
    default                                                  "/***";
}
log_format velaris_public '$remote_addr [$time_local] "$request_method $vpub_log_path" $status $body_bytes_sent '
                          '$request_time';

server {
    listen 80;
    listen [::]:80;
    server_name VELARIS_PUBLIC_DOMAIN_PLACEHOLDER;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name VELARIS_PUBLIC_DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/VELARIS_PUBLIC_DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VELARIS_PUBLIC_DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/velaris_public_access.log velaris_public;
    error_log  /var/log/nginx/velaris_public_error.log crit;   # an error line can still name the request: keep it at crit

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;      # a link token must not leak to another site through Referer
    add_header Cache-Control "no-store" always;

    client_max_body_size 256k;      # forms, scheduling and signing are small JSON; uploads are not served here
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn vpub_conn 30;

    location ^~ /careers/   { proxy_pass http://velaris_public_backend; include /etc/nginx/velaris_public_proxy.conf; }
    location ^~ /schedule/  { proxy_pass http://velaris_public_backend; include /etc/nginx/velaris_public_proxy.conf; }
    location ^~ /interview/ { proxy_pass http://velaris_public_backend; include /etc/nginx/velaris_public_proxy.conf; }
    location ^~ /sign/      { proxy_pass http://velaris_public_backend; include /etc/nginx/velaris_public_proxy.conf; }

    location = /healthz { default_type text/plain; return 200 "ok\n"; access_log off; }
    location /          { return 404; }
}
