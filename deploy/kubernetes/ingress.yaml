apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetheros-ingress
  namespace: aetheros
  labels:
    app.kubernetes.io/name: aetheros-api
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    # cert-manager: automatically provision and renew TLS certificate
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Increase body size limit for file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # WebSocket / SSE support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  tls:
    - hosts:
        - yourdomain.com  # TODO: replace with your actual domain
      secretName: aetheros-tls
  rules:
    - host: yourdomain.com  # TODO: replace with your actual domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
