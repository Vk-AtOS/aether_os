apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aetheros
  labels:
    app.kubernetes.io/name: aetheros-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app: aetheros-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetheros-api
  namespace: aetheros
  labels:
    app.kubernetes.io/name: aetheros-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aetheros-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aetheros-api
        # Velaris's NetworkPolicy admits only pods with these labels (KAN-112)
        app.kubernetes.io/name: aetheros-api
        app.kubernetes.io/component: api
    spec:
      initContainers:
        # The checkpoint signer refuses a key file that group or others can read; copy the Secret into an emptyDir at 0600.
        - name: ledger-key
          image: aetheros/api:latest   # same image and user as the api container, so the 0600 file is readable by it
          command: ["sh", "-c", "cp /src/key.pem /ledger/ledger_signing_key.pem && chmod 600 /ledger/ledger_signing_key.pem"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: ledger-key-src, mountPath: /src, readOnly: true}
            - {name: ledger-key, mountPath: /ledger}
      containers:
        - name: api
          image: aetheros/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aetheros-config
          env:
            - name: AETHER_LEDGER_SIGNING_KEY
              value: /ledger/ledger_signing_key.pem
            - name: AETHER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: AETHER_SECRET_KEY
            - name: AETHER_ONE_ZT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: AETHER_ONE_ZT_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: ANTHROPIC_API_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: OPENROUTER_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: REDIS_URL
            - name: AETHER_JWT_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: AETHER_JWT_PRIVATE_KEY_B64
            - name: AETHER_JWT_PUBLIC_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: AETHER_JWT_PUBLIC_KEY_B64
            - name: SAML_SP_ENTITY_ID
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: SAML_SP_ENTITY_ID
            - name: SAML_SP_ACS_URL
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: SAML_SP_ACS_URL
            - name: AETHER_FIELD_KEY
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: AETHER_FIELD_KEY
            - name: AETHER_PREVIEW_SECRET
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: AETHER_PREVIEW_SECRET
            - name: VELARIS_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: VELARIS_API_SECRET
                  optional: true
            - name: VELARIS_IDENTITY_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: aetheros-secrets
                  key: VELARIS_IDENTITY_PRIVATE_KEY_PEM
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: output-data
              mountPath: /app/output
            - {name: ledger-key, mountPath: /ledger, readOnly: true}
      volumes:
        - name: ledger-key-src
          secret:
            secretName: aetheros-secrets
            items:
              - {key: AETHER_LEDGER_SIGNING_KEY_PEM, path: key.pem}
        - name: ledger-key
          emptyDir: {medium: Memory}
        - name: output-data
          emptyDir: {}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aetheros-api-hpa
  namespace: aetheros
  labels:
    app.kubernetes.io/name: aetheros-api
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aetheros-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
