apiVersion: v1
kind: Secret
metadata:
  name: aetheros-secrets
  namespace: aetheros
  labels:
    app.kubernetes.io/name: aetheros
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # TODO: Replace all placeholder values below with real secrets before deploying.
  # Use: kubectl create secret generic aetheros-secrets --from-env-file=.env -n aetheros
  # Or seal with: https://github.com/bitnami-labs/sealed-secrets

  # JWT / session signing key — generate with: openssl rand -hex 32
  AETHER_SECRET_KEY: "REPLACE_ME_openssl_rand_hex_32"

  # Anthropic API key — obtain from https://console.anthropic.com
  ANTHROPIC_API_KEY: "REPLACE_ME_sk-ant-..."

  # OpenRouter API key (optional, for multi-model routing)
  OPENROUTER_API_KEY: "REPLACE_ME_or-..."

  # Zero-trust secret — generate with: openssl rand -hex 32
  AETHER_ONE_ZT_SECRET: "REPLACE_ME_openssl_rand_hex_32"

  # PostgreSQL password — must match POSTGRES_PASSWORD in postgres.yaml
  POSTGRES_PASSWORD: "REPLACE_ME_strong_password"

  # Redis password — must match --requirepass in redis.yaml
  REDIS_PASSWORD: "REPLACE_ME_strong_password"

  # Constructed from above — update domain/password to match your values
  DATABASE_URL: "postgresql://aether_user:REPLACE_ME_strong_password@postgres:5432/aether_os"
  REDIS_URL: "redis://:REPLACE_ME_strong_password@redis:6379/0"

  # SAML SP settings (leave empty strings if SAML is not used)
  SAML_SP_ENTITY_ID: ""
  SAML_SP_ACS_URL: ""
