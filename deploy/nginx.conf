# NOTE: APP_DOMAIN_PLACEHOLDER is replaced at deploy time by deploy.sh via sed.
# Run: bash deploy/deploy.sh yourdomain.com  — do NOT manually edit this placeholder.

# AetherOS — production nginx config
# Place at: /etc/nginx/sites-available/aetheros
# Enable:   ln -s /etc/nginx/sites-available/aetheros /etc/nginx/sites-enabled/
#
# SETUP REQUIRED BEFORE USE:
#   1. Replace APP_DOMAIN below with your actual domain (e.g. app.aetheros.io)
#   2. Run: certbot --nginx -d $APP_DOMAIN  (before enabling this file)
#   3. Reload nginx: systemctl reload nginx
#
# Define APP_DOMAIN once — referenced in all blocks via variable
# (nginx doesn't support shell-style variables in configs; use sed at deploy time)
#   sed -i "s/APP_DOMAIN_PLACEHOLDER/app.aetheros.io/g" /etc/nginx/sites-available/aetheros
#   sed -i "s/PREVIEW_DOMAIN_PLACEHOLDER/preview.aetheros.io/g" /etc/nginx/sites-available/aetheros
#
# PREVIEW_DOMAIN serves generated apps (gateway/preview_server.py on 127.0.0.1:8100) on an
# origin of their own, so their JavaScript cannot touch the dashboard. It needs its own DNS
# record and certificate. Every run is served from <run-id>.$PREVIEW_DOMAIN, so DNS needs a
# wildcard record (*.$PREVIEW_DOMAIN -> this host) and the certificate a wildcard (Let's Encrypt
# wildcards need DNS-01: certbot certonly --manual --preferred-challenges dns
# -d $PREVIEW_DOMAIN -d "*.$PREVIEW_DOMAIN", or a DNS plugin). Never serve generated apps on
# APP_DOMAIN, and never add PREVIEW_DOMAIN to the API's CORS_ORIGINS.

# This file is an http-context fragment: it is included from /etc/nginx/nginx.conf's http {}
# through sites-enabled/. Do NOT add events {} or http {} here (nginx -t fails with
# "directive is not allowed here"). Tune worker_processes / worker_connections in nginx.conf.
# tests/test_deploy_files.py checks this structure because `nginx -t` is not run in CI.

# Rate limiting zones (LAUNCH-032: more aggressive DDoS protection). nginx accepts these only
# inside http {}; at top level the whole config failed `nginx -t` (KAN-154).
# Recommend: place Cloudflare or another CDN/WAF in front of this server for L7 DDoS protection
limit_req_zone $binary_remote_addr zone=api:10m  rate=600r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sse:10m  rate=60r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Upstream pool — matches uvicorn workers=4 in aetheros.service
upstream aetheros_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

# ── Redirect HTTP → HTTPS ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN_PLACEHOLDER;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name APP_DOMAIN_PLACEHOLDER;

    # TLS — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/APP_DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; frame-src https://*.PREVIEW_DOMAIN_PLACEHOLDER; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net;" always;

    # Connection limits per IP (protects against slow-loris)
    limit_conn perip 300;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;

    # ── Static dashboard (React build) ──────────────────────────────────
    root /home/aether_os/dashboard/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    location ~* \.(js|css|woff2|png|svg|ico|webp|avif)$ {
        expires 1y;
    }

    # ── SSE streaming — MUST come before /api/ (more specific) ──────────
    # Actual FastAPI endpoint: /factory/runs/{run_id}/stream
    # Old config had: /api/factory/run/ (singular, wrong path) — never matched.
    location ~ ^/api/factory/runs/[^/]+/stream$ {
        limit_req zone=sse burst=20 nodelay;

        # Strip /api prefix when forwarding to uvicorn
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass          http://aetheros_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";      # Keep-alive for SSE
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Critical: disable ALL buffering for SSE
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;   # 1 hour — factory runs take time
        proxy_send_timeout  3600s;
    # The app sets Content-Type/Cache-Control/X-Accel-Buffering on the stream. add_header here
    # would drop the server-level security headers (nginx add_header inheritance).
    }

    # ── Auth endpoints — strict rate limit ──────────────────────────────
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://aetheros_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $http_host;   # <run-id>.PREVIEW_DOMAIN names the run
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Run-app build — long timeout, npm install takes 5-10 min ──────
    location ~ ^/api/factory/runs/[^/]+/run-app$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://aetheros_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $http_host;   # <run-id>.PREVIEW_DOMAIN names the run
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 10m;
    }

    # ── API gateway (all other /api/* routes) ───────────────────────────
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://aetheros_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $http_host;   # <run-id>.PREVIEW_DOMAIN names the run
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Body size — allow large requirement uploads
        client_max_body_size 10m;
    }

    # ── App Preview — never served on the dashboard origin; see the preview server below ──
    location /app-preview/ {
        return 404;   # previews open from the dashboard, on <run-id>.PREVIEW_DOMAIN
    }

    # ── Client portal (unauthenticated access) ──────────────────────────
    location /portal/ {
        proxy_pass         http://aetheros_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $http_host;   # <run-id>.PREVIEW_DOMAIN names the run
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Prometheus /metrics — restrict to localhost only (LAUNCH-024) ───
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://aetheros_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Block sensitive paths ────────────────────────────────────────────
    location ~ /\.           { deny all; return 404; }
    location ~ \.env$        { deny all; return 404; }
    location ~ \.git/        { deny all; return 404; }
    location ~ /\.ssh/       { deny all; return 404; }
    location = /favicon.ico  { log_not_found off; access_log off; }
    location = /robots.txt   { log_not_found off; access_log off; }
}

# ── Preview origin: generated apps only (gateway/preview_server.py) ─────────
server {
    listen 80;
    listen [::]:80;
    server_name PREVIEW_DOMAIN_PLACEHOLDER *.PREVIEW_DOMAIN_PLACEHOLDER;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name PREVIEW_DOMAIN_PLACEHOLDER *.PREVIEW_DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/PREVIEW_DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PREVIEW_DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers (CSP with frame-ancestors = the dashboard, COOP, CORP) are set by the
    # preview server itself. No X-Frame-Options DENY here: the dashboard may iframe previews.
    add_header Strict-Transport-Security "max-age=63072000" always;
    limit_conn perip 50;

    location / {
        proxy_pass         http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $http_host;   # <run-id>.PREVIEW_DOMAIN names the run
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Platform credentials never reach this origin's upstream (defence in depth).
        proxy_set_header   X-Api-Key "";
        proxy_set_header   X-Org-Id "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10m;
    }
}
