# fail2ban filter for AetherOS — detects rate-limit abuse from nginx logs
# Install: cp deploy/fail2ban/aetheros.conf /etc/fail2ban/filter.d/aetheros.conf
#          cp deploy/fail2ban/aetheros-jail.conf /etc/fail2ban/jail.d/aetheros.conf
#          systemctl reload fail2ban

[Definition]
# Match nginx 429 Too Many Requests responses
failregex = ^<HOST> .+ "(GET|POST|PUT|DELETE|PATCH) .+" 429
            ^<HOST> .+ "(GET|POST|PUT|DELETE|PATCH) /v2/auth/(login|register|refresh)" (400|401|403|422)

ignoreregex =
