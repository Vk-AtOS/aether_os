# fail2ban jail for AetherOS
# Install: cp deploy/fail2ban/aetheros-jail.conf /etc/fail2ban/jail.d/aetheros.conf
#          systemctl reload fail2ban

[aetheros-ratelimit]
enabled  = true
filter   = aetheros
logpath  = /var/log/nginx/access.log
maxretry = 20
findtime = 60
bantime  = 600
action   = iptables-multiport[name=aetheros, port="80,443", protocol=tcp]

[aetheros-auth]
enabled  = true
filter   = aetheros
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 300
bantime  = 3600
action   = iptables-multiport[name=aetheros-auth, port="80,443", protocol=tcp]
