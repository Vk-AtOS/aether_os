# Prometheus for docker-compose.observability.yml (KAN-50). The scrape key is read from a mounted file, never written here.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: aetheros-api
    metrics_path: /metrics
    http_headers:
      X-Metrics-Key:
        files: [/etc/prometheus/metrics_key]
    static_configs:
      - targets: ["api:8000"]
# Alert routing (Alertmanager receiver: pager or chat channel) is the owner's decision; add `alerting:` here when it exists.
