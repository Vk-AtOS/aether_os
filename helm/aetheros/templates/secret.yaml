{{/*
─────────────────────────────────────────────────────────────────────────────
AetherOS Secret — Sensitive environment variables
─────────────────────────────────────────────────────────────────────────────
SECURITY NOTE:
  Do NOT store real credentials in values.yaml or commit them to source
  control. In production use one of:
    • External Secrets Operator + AWS Secrets Manager / GCP Secret Manager
    • HashiCorp Vault with the Vault Agent Injector
    • Sealed Secrets (Bitnami)
    • SOPS-encrypted values files

  This template is intentionally structured so that the Secret can be
  pre-created outside Helm (with --set secrets.*="" and the real Secret
  managed externally) or populated via a CI/CD pipeline at deploy time.
─────────────────────────────────────────────────────────────────────────────
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aetheros.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aetheros.labels" . | nindent 4 }}
  annotations:
    app.kubernetes.io/component: secret
    # helm.sh/resource-policy: keep  ← uncomment to prevent accidental deletion
type: Opaque
stringData:
  # ── Core security ──────────────────────────────────────────────────────────
  AETHER_SECRET_KEY: {{ .Values.secrets.AETHER_SECRET_KEY | quote }}
  AETHER_ONE_ZT_SECRET: {{ .Values.secrets.AETHER_ONE_ZT_SECRET | quote }}
  AETHER_ADMIN_PASS: {{ .Values.secrets.AETHER_ADMIN_PASS | quote }}

  # ── Database ───────────────────────────────────────────────────────────────
  # Auto-constructed from postgresql sub-chart values when enabled;
  # override secrets.DATABASE_URL for an external PostgreSQL instance.
  DATABASE_URL: {{ include "aetheros.databaseURL" . | quote }}

  # ── Redis ──────────────────────────────────────────────────────────────────
  # Auto-constructed from redis sub-chart values when enabled;
  # override secrets.REDIS_URL for an external Redis instance.
  REDIS_URL: {{ include "aetheros.redisURL" . | quote }}

  # ── LLM API keys ───────────────────────────────────────────────────────────
  ANTHROPIC_API_KEY: {{ .Values.secrets.ANTHROPIC_API_KEY | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.GOOGLE_API_KEY | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.OPENROUTER_API_KEY | quote }}

  # ── AWS credentials (for Bedrock) ─────────────────────────────────────────
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.AWS_ACCESS_KEY_ID | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.AWS_SECRET_ACCESS_KEY | quote }}

  # ── Notifications ──────────────────────────────────────────────────────────
  SMTP_PASSWORD: {{ .Values.secrets.SMTP_PASSWORD | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.SLACK_WEBHOOK_URL | quote }}

  # ── GitHub App integration ─────────────────────────────────────────────────
  GITHUB_APP_PRIVATE_KEY: {{ .Values.secrets.GITHUB_APP_PRIVATE_KEY | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.GITHUB_WEBHOOK_SECRET | quote }}

  # ── GitLab ─────────────────────────────────────────────────────────────────
  GITLAB_TOKEN: {{ .Values.secrets.GITLAB_TOKEN | quote }}

  # ── Payments (Razorpay) ────────────────────────────────────────────────────
  RAZORPAY_KEY_ID: {{ .Values.secrets.RAZORPAY_KEY_ID | quote }}
  RAZORPAY_KEY_SECRET: {{ .Values.secrets.RAZORPAY_KEY_SECRET | quote }}
  RAZORPAY_WEBHOOK_SECRET: {{ .Values.secrets.RAZORPAY_WEBHOOK_SECRET | quote }}

  # ── Field encryption, preview signing, Velaris ───────────────────────────
  AETHER_FIELD_KEY: {{ .Values.secrets.AETHER_FIELD_KEY | quote }}
  AETHER_PREVIEW_SECRET: {{ .Values.secrets.AETHER_PREVIEW_SECRET | quote }}
  VELARIS_API_SECRET: {{ .Values.secrets.VELARIS_API_SECRET | quote }}
  VELARIS_IDENTITY_PRIVATE_KEY_PEM: {{ .Values.secrets.VELARIS_IDENTITY_PRIVATE_KEY_PEM | quote }}

  # ── SCIM 2.0 IdP provisioning ──────────────────────────────────────────────
  SCIM_BEARER_TOKEN: {{ .Values.secrets.SCIM_BEARER_TOKEN | quote }}
  SCIM_ORG_ID: {{ .Values.secrets.SCIM_ORG_ID | quote }}
