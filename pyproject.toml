[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether_os"
version = "1.0.0"
description = "AetherOS — Autonomous AI Software Factory"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "AetherOS", email = "platform@aetheros.ai"},
]
keywords = ["ai", "saas", "app-factory", "llm", "multi-tenant", "code-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

# Map the `aether_os` package root to the project root directory.
# This makes `from aether_os.core.db import ...` resolve to ./core/db.py
# regardless of what the project directory is named on disk.
# After `pip install -e .`, all aether_os.* imports work correctly.
[tool.setuptools]
package-dir = {"aether_os" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "strict"
# Add the project parent to sys.path so aether_os.* imports resolve in tests
pythonpath = [".."]
testpaths = ["tests"]
addopts = "--ignore=tests/test_bedrock_integration.py"
filterwarnings = [
    # asyncio selector transport / redis connection left open by TestClient teardown
    "ignore::ResourceWarning",
    # coroutine-never-awaited from async test harness GC
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]

[tool.ruff.lint.per-file-ignores]
# Templates copied verbatim into generated apps: their imports belong to the generated code.
"phases/p04a_backend_codegen/seed_templates/__init__.py" = ["F401"]
