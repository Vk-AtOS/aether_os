version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aether_os
      POSTGRES_USER: aether_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether_dev_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Port not exposed to host — internal only for security (SEC-004)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether_user -d aether_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    # Port not exposed to host — internal only for security (SEC-005)
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AetherOS API ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aether_user:${POSTGRES_PASSWORD:-aether_dev_pass}@db:5432/aether_os
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      REQUIRE_REDIS: "true"
      ENVIRONMENT: production
      AETHER_SECRET_KEY: ${AETHER_SECRET_KEY}
      AETHER_ONE_ZT_SECRET: ${AETHER_ONE_ZT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-domain.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://your-domain.com/dashboard}
      SAML_SP_ENTITY_ID: ${SAML_SP_ENTITY_ID:-}
      SAML_SP_ACS_URL: ${SAML_SP_ACS_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - output_data:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pg_data:
  redis_data:
  output_data:
