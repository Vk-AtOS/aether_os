version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aether_os
      POSTGRES_USER: aether_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether_dev_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Port not exposed to host — internal only for security (SEC-004)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether_user -d aether_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - set a strong random password}
    volumes:
      - redis_data:/data
    # Port not exposed to host — internal only for security (SEC-005)
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AetherOS API ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aether_user:${POSTGRES_PASSWORD:-aether_dev_pass}@db:5432/aether_os
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      REQUIRE_REDIS: "true"
      ENVIRONMENT: production
      # RS256 JWT keys (recommended) — set these to enable asymmetric signing
      AETHER_JWT_PRIVATE_KEY_B64: ${AETHER_JWT_PRIVATE_KEY_B64:-}
      AETHER_JWT_PUBLIC_KEY_B64: ${AETHER_JWT_PUBLIC_KEY_B64:-}
      # HS256 fallback — used only if RS256 keys above are not set
      AETHER_SECRET_KEY: ${AETHER_SECRET_KEY:-}
      AETHER_ONE_ZT_SECRET: ${AETHER_ONE_ZT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PRIMARY_LLM: ${PRIMARY_LLM:-anthropic}
      BEDROCK_ENABLED: ${BEDROCK_ENABLED:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BEDROCK_MODEL_HEAVY: ${BEDROCK_MODEL_HEAVY:-au.anthropic.claude-sonnet-4-6}
      BEDROCK_MODEL_LIGHT: ${BEDROCK_MODEL_LIGHT:-amazon.nova-lite-v1:0}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required - set to https://yourdomain.com}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required - set to https://yourdomain.com/dashboard}
      SAML_SP_ENTITY_ID: ${SAML_SP_ENTITY_ID:-}
      SAML_SP_ACS_URL: ${SAML_SP_ACS_URL:-}
      # OAuth2 Social Login (get credentials from Google/GitHub developer consoles)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # SAML SSO IdP configuration (from your Okta/Azure AD app)
      SAML_IDP_ENTITY_ID: ${SAML_IDP_ENTITY_ID:-}
      SAML_IDP_SSO_URL: ${SAML_IDP_SSO_URL:-}
      SAML_IDP_CERT: ${SAML_IDP_CERT:-}
      # Field-level encryption key (generate: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
      AETHER_FIELD_KEY: ${AETHER_FIELD_KEY:-}
      # Error tracking
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Admin account created on first startup
      # INFRA-H2: standardised to AETHER_ADMIN_PASS — matches core/seed.py
      AETHER_ADMIN_EMAIL: ${AETHER_ADMIN_EMAIL:-admin@example.com}
      AETHER_ADMIN_PASS: ${AETHER_ADMIN_PASS:?AETHER_ADMIN_PASS must be set in .env}
      # Generated apps run in Docker sandbox containers (core/sandbox/docker_backend.py) and are
      # served only from the preview origin (gateway/preview_server.py, service `preview`).
      AETHER_SANDBOX: docker
      AETHER_SANDBOX_IMAGE: ${AETHER_SANDBOX_IMAGE:-aether-sandbox:1}
      AETHER_PREVIEW_ORIGIN: ${AETHER_PREVIEW_ORIGIN:?AETHER_PREVIEW_ORIGIN is required - e.g. https://preview.yourdomain.com}
      AETHER_PREVIEW_SECRET: ${AETHER_PREVIEW_SECRET:?AETHER_PREVIEW_SECRET is required - 32+ random characters}
      AETHER_DASHBOARD_ORIGIN: ${AETHER_DASHBOARD_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The gateway starts sandbox containers through the host's Docker daemon. Whoever controls
    # this socket is root on the host: the API image needs the docker CLI, and its user must be
    # in the socket's group (DOCKER_GID). The run directories are bind-mounted from the host at
    # the SAME path, because sandbox containers mount them by the path the gateway sees.
    group_add:
      - ${DOCKER_GID:?DOCKER_GID is required - the group id owning /var/run/docker.sock}
    volumes:
      # INFRA-H1: container runs as non-root user 'aether'; the host directory must exist and
      # be owned by that uid. (Was the named volume aether_os_data — copy its data over once.)
      - /home/aether/.aether_os:/home/aether/.aether_os
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Preview server: the only thing that serves generated apps, on its own origin ──
  # Host network so it reaches the apps' ports published on the host's 127.0.0.1; it listens
  # on 127.0.0.1:8100 and nginx serves it as the preview domain. No platform keys, no database,
  # no Docker socket; it reads only the run state files (read-only mount).
  preview:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    command: ["uvicorn", "aether_os.gateway.preview_server:create_preview_app", "--factory",
              "--host", "127.0.0.1", "--port", "8100", "--workers", "1"]
    environment:
      AETHER_PREVIEW_ORIGIN: ${AETHER_PREVIEW_ORIGIN:?AETHER_PREVIEW_ORIGIN is required}
      AETHER_PREVIEW_SECRET: ${AETHER_PREVIEW_SECRET:?AETHER_PREVIEW_SECRET is required}
      AETHER_DASHBOARD_ORIGIN: ${AETHER_DASHBOARD_ORIGIN:-}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      ENVIRONMENT: production
    volumes:
      - /home/aether/.aether_os:/home/aether/.aether_os:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8100/__preview/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_data:
  redis_data:
