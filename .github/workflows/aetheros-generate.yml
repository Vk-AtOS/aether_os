name: AetherOS Generate
on:
  issues:
    types: [labeled]

jobs:
  generate:
    if: github.event.label.name == 'aetheros-generate'
    runs-on: ubuntu-latest
    steps:
      - name: AetherOS Pipeline
        # SEC-C4: user-controlled values (issue body/title) are passed via env
        # variables, never interpolated directly into shell commands.
        # Direct interpolation of ${{ github.event.issue.body }} into a shell
        # command gives any issue author arbitrary code execution on the runner.
        env:
          AETHEROS_URL: ${{ secrets.AETHEROS_URL }}
          AETHEROS_TOKEN: ${{ secrets.AETHEROS_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          RUN_ID=$(curl -s -X POST "$AETHEROS_URL/factory/start" \
            -H "Authorization: Bearer $AETHEROS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-raw "{\"requirement\": $(echo "$ISSUE_BODY" | jq -Rs .)}" | jq -r '.run_id')

          # Poll status
          while true; do
            STATUS=$(curl -s "$AETHEROS_URL/factory/runs/$RUN_ID" -H "Authorization: Bearer $AETHEROS_TOKEN" | jq -r '.status')
            if [ "$STATUS" == "completed" ]; then break; fi
            sleep 10
          done

          # Download and commit
          curl -s "$AETHEROS_URL/factory/runs/$RUN_ID/download" -H "Authorization: Bearer $AETHEROS_TOKEN" > output.zip
          unzip output.zip -d .
          git config user.name "AetherOS"
          git config user.email "aetheros@factory.com"
          git checkout -b "aetheros/$RUN_ID"
          git add .
          git commit -m "Generated by AetherOS [run=$RUN_ID]"
          git push origin "aetheros/$RUN_ID"
          gh pr create --title "AetherOS Gen: $ISSUE_TITLE" --body "Generated files from run $RUN_ID"
