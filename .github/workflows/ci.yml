name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        # pgvector build of Postgres 15: the schema uses the vector type (core/schema_ddl.py runs CREATE EXTENSION vector, which needs it installed)
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aether_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aether_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      AETHER_SECRET_KEY: test-secret-key-32-chars-minimum-x
      AETHER_ONE_ZT_SECRET: test-zt-secret-32-chars-minimum-xx
      AETHER_ADMIN_EMAIL: admin@test.com
      AETHER_ADMIN_PASSWORD: TestAdmin@123
      AETHER_FIELD_KEY: ${{ secrets.AETHER_FIELD_KEY || '' }}
      # The Postgres-specific tests (ledger scale, advisory locks) skip without this.
      AETHER_PG_TEST_URL: postgresql://ci:ci-only-password@localhost:5432/aether_ci
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: test
      REQUIRE_REDIS: "false"
      # Raise this as coverage grows; it must never go down. Measured 68% (pytest-cov 7.1, --cov=., r6/a_gen): floor = measured - 2.
      COVERAGE_FLOOR: "66"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # The package must be importable as aether_os: the checkout dir is that package.
        run: |
          pip install -r requirements.lock
          pip install ruff bandit pip-audit pytest-cov pytest-timeout
          mkdir -p "$RUNNER_TEMP/pkg" && ln -sfn "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pkg/aether_os"
          echo "PYTHONPATH=$RUNNER_TEMP/pkg" >> "$GITHUB_ENV"

      - name: Build the sandbox image (generated code only runs in it on Linux)
        # Without it every test that runs generated code failed with 'sandbox backend docker is not available'.
        run: docker build -f core/sandbox/Dockerfile -t aether-sandbox:1 core/sandbox

      - name: Apply the sandbox host firewall (the runner refuses generated code unless the isolation probe passes)
        # docker_backend verifies host_firewall.sh is really applied; this is the documented host setup, run as root.
        run: sudo bash core/sandbox/host_firewall.sh

      - name: Lint with ruff (blocking)
        # Pyflakes (F), syntax errors (E9), B904 (raise ... from), E401 (one import per line), PIE790 (needless pass) and
        # W605 (invalid escape) are clean: zero tolerance. The wider style set (line length, import order, typing
        # modernisation) has thousands of findings and is not enforced; add a rule here only once it is clean.
        run: ruff check . --select F,E9,B904,E401,PIE790,W605

      - name: Docs match code (routes, paths, env vars, scripts named in the docs exist)
        run: python scripts/ci/check_docs.py

      - name: Static security analysis (bandit, high severity)
        run: bandit -r core gateway orchestrator phases agents -lll -q --exclude '*/tests/*'

      - name: Run tests
        working-directory: ${{ runner.temp }}/pkg/aether_os
        run: |
          pytest tests/ \
            --timeout=300 \
            --tb=short \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=$COVERAGE_FLOOR

      # The two scans below run AFTER the tests on purpose: they are blocking, but a red scan (a known advisory, a secret in history)
      # must not hide whether the tests pass.
      - name: Dependency vulnerabilities (pip-audit, blocking)
        if: always()
        # Audits the pinned lock file; any finding fails. Accepted no-fix findings are listed with reasons in the script.
        run: bash scripts/ci/audit_deps.sh

      - name: Secret scan (gitleaks, full history, blocking)
        if: always()
        # Pinned, checksum-verified binary: no GITLEAKS_LICENSE needed. Config: .gitleaks.toml.
        run: |
          bash scripts/ci/install_gitleaks.sh "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" bash scripts/ci/secret_scan.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  migrations:
    # The schema path compose, deploy.sh and Helm all run (scripts/db_migrate.py) against an empty scratch Postgres.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aether_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aether_migrate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/aether_migrate
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Empty database, then upgrade path, ledger triggers
        run: bash scripts/ci/check_migrations.sh

  container-scan:
    # The image that compose and Helm run, scanned for known OS and Python package vulnerabilities. Blocking for
    # CRITICAL and HIGH that already have a fix; unfixed ones are not reported as failures.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t aetheros-api:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.28.0   # the action's tags carry a leading v
        with:
          image-ref: aetheros-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

  deploy-files:
    # Helm chart renders and lints; shell scripts parse; the compose file resolves.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm lint and template
        run: |
          helm lint helm/aetheros --set config.AETHER_PREVIEW_ORIGIN=https://preview.example.com
          helm template ci helm/aetheros --set config.AETHER_PREVIEW_ORIGIN=https://preview.example.com --set secrets.AETHER_LEDGER_SIGNING_KEY_PEM=x > /dev/null
      - name: Shell syntax
        run: for f in deploy/*.sh deploy/scripts/*.sh deploy/kubernetes/apply.sh scripts/*.sh scripts/ci/*.sh; do bash -n "$f"; done
      - name: Compose file resolves
        env:
          POSTGRES_PASSWORD: x
          REDIS_PASSWORD: x
          AETHER_FIELD_KEY: x
          AETHER_ADMIN_PASS: x
          CORS_ORIGINS: https://example.com
          FRONTEND_URL: https://example.com/dashboard
          AETHER_PREVIEW_ORIGIN: https://preview.example.com
          AETHER_PREVIEW_SECRET: x
          DOCKER_GID: "999"
          # every ${VAR:?} in docker-compose.yml must have a value here, or `config` fails before checking anything
          VELARIS_ORG: ci-org
          VELARIS_API_SECRET: x
          VELARIS_IMAGE: velaris:ci
        run: docker compose -f docker-compose.yml config -q

  generated-npm-build:
    # KAN-180: a generated frontend must really build (npm install + vite build), not only pass the static checks.
    # Skippable: set the repository variable SKIP_NPM_BUILD=true to turn it off (e.g. no npm registry access).
    if: ${{ vars.SKIP_NPM_BUILD != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      AETHER_NPM_BUILD_TEST: "1"
      AETHER_FIELD_KEY: ${{ secrets.AETHER_FIELD_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          pip install -r requirements.lock pytest pytest-timeout
          mkdir -p "$RUNNER_TEMP/pkg" && ln -sfn "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pkg/aether_os"
          echo "PYTHONPATH=$RUNNER_TEMP/pkg" >> "$GITHUB_ENV"
      - name: Generate a product and build its frontend for real
        working-directory: ${{ runner.temp }}/pkg/aether_os
        run: pytest tests/test_r3_e2e_generated_output.py --timeout=1200 -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Same install as Dockerfile / deploy.sh / setup_vps.sh: needs the committed package-lock.json.
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Audit (runtime dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  dashboard-e2e:
    # Click-through specs (dashboard/e2e) against the built dashboard with the API stubbed in the browser (KAN-62,
    # KAN-18/21/23, the Velaris screens). Needs no backend, only Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Playwright specs
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: dashboard/test-results
          retention-days: 7
