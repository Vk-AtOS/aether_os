name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aether_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aether_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      AETHER_SECRET_KEY: test-secret-key-32-chars-minimum-x
      AETHER_ONE_ZT_SECRET: test-zt-secret-32-chars-minimum-xx
      AETHER_ADMIN_EMAIL: admin@test.com
      AETHER_ADMIN_PASSWORD: TestAdmin@123
      AETHER_FIELD_KEY: ${{ secrets.AETHER_FIELD_KEY || '' }}
      # The Postgres-specific tests (ledger scale, advisory locks) skip without this.
      AETHER_PG_TEST_URL: postgresql://ci:ci-only-password@localhost:5432/aether_ci
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: test
      REQUIRE_REDIS: "false"
      # Raise this as coverage grows; it must never go down.
      COVERAGE_FLOOR: "50"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # The package must be importable as aether_os: the checkout dir is that package.
        run: |
          pip install -r requirements.lock
          pip install ruff bandit pip-audit pytest-cov pytest-timeout
          mkdir -p "$RUNNER_TEMP/pkg" && ln -sfn "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pkg/aether_os"
          echo "PYTHONPATH=$RUNNER_TEMP/pkg" >> "$GITHUB_ENV"

      - name: Lint with ruff (blocking)
        # Pyflakes (F), syntax errors (E9) and B904 (raise ... from) are clean (KAN-59): zero tolerance.
        run: ruff check . --select F,E9,B904

      - name: Static security analysis (bandit, high severity)
        run: bandit -r core gateway orchestrator phases agents -lll -q --exclude '*/tests/*'

      - name: Dependency vulnerabilities (pip-audit, blocking)
        # Audits the pinned lock file; any finding fails. Accepted no-fix findings are listed with reasons in the script.
        run: bash scripts/ci/audit_deps.sh

      - name: Secret scan (gitleaks, full history, blocking)
        # Pinned, checksum-verified binary: no GITLEAKS_LICENSE needed. Config: .gitleaks.toml.
        run: |
          bash scripts/ci/install_gitleaks.sh "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" bash scripts/ci/secret_scan.sh

      - name: Run tests
        working-directory: ${{ runner.temp }}/pkg/aether_os
        run: |
          pytest tests/ \
            --timeout=300 \
            --tb=short \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=$COVERAGE_FLOOR

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Same install as Dockerfile / deploy.sh / setup_vps.sh: needs the committed package-lock.json.
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Audit (runtime dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  dashboard-e2e:
    # Click-through specs (dashboard/e2e) against the built dashboard with the API stubbed in the browser (KAN-62,
    # KAN-18/21/23, the Velaris screens). Needs no backend, only Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Playwright specs
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: dashboard/test-results
          retention-days: 7
