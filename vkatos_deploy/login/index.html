<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign in — vkatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07070F;--bg2:#0D0D1A;
  --purple:#7C3AED;--purple2:#9B6FFA;
  --cyan:#00C4D4;
  --white:#F0F0FF;--muted:#5A5A7A;--muted2:#8080A0;
  --border:rgba(124,58,237,.2);--border2:rgba(255,255,255,.07);
  --card:rgba(255,255,255,.04);
  --font-d:'Syne',sans-serif;--font-b:'DM Sans',sans-serif;--font-m:'DM Mono',monospace
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--white);font-family:var(--font-b);min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

/* NAV */
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;height:60px;border-bottom:1px solid var(--border2)
}
.logo{
  font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--white) 30%,var(--purple2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.logo span{-webkit-text-fill-color:var(--cyan)}
.nav-r{font-size:13px;color:var(--muted2)}
.nav-r a{color:var(--purple2);font-weight:500;margin-left:6px;transition:color .2s}
.nav-r a:hover{color:var(--purple)}

/* CANVAS BG */
canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.3;z-index:0;pointer-events:none}

/* MAIN */
main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:40px 20px;position:relative;z-index:1
}
.auth-card{
  width:100%;max-width:440px;
  background:rgba(13,13,26,.9);backdrop-filter:blur(24px);
  border:1px solid var(--border2);border-radius:24px;
  padding:48px 44px;
  box-shadow:0 32px 80px rgba(0,0,0,.5),0 0 0 1px rgba(124,58,237,.08)
}

/* TABS */
.tabs{display:flex;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;margin-bottom:36px}
.tab{
  flex:1;text-align:center;padding:10px;border-radius:9px;
  font-family:var(--font-d);font-size:14px;font-weight:600;letter-spacing:.01em;
  color:var(--muted2);cursor:pointer;transition:all .2s;border:none;background:none
}
.tab.active{background:rgba(124,58,237,.2);color:var(--purple2);border:1px solid rgba(124,58,237,.25)}

/* HEADING */
.auth-h{font-family:var(--font-d);font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.auth-sub{font-size:14px;color:var(--muted2);margin-bottom:32px;line-height:1.6;font-weight:300}

/* OAUTH BUTTONS */
.oauth-btn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;padding:13px 20px;border-radius:12px;
  font-family:var(--font-d);font-size:14px;font-weight:600;letter-spacing:.01em;
  border:1px solid var(--border2);background:rgba(255,255,255,.05);
  color:var(--white);cursor:pointer;transition:all .2s;margin-bottom:12px
}
.oauth-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14);transform:translateY(-1px)}
.oauth-btn svg{width:18px;height:18px;flex-shrink:0}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--muted);font-size:12px;font-family:var(--font-m);letter-spacing:.08em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border2)}

/* FORM */
.field{margin-bottom:18px}
label{display:block;font-size:12px;font-family:var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
input[type=text],input[type=email],input[type=password]{
  width:100%;padding:13px 16px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border2);
  color:var(--white);font-family:var(--font-b);font-size:15px;outline:none;
  transition:border-color .2s,background .2s
}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{
  border-color:rgba(124,58,237,.5);background:rgba(124,58,237,.06)
}
input::placeholder{color:var(--muted)}

.forgot{display:block;text-align:right;font-size:12px;color:var(--muted2);margin-top:6px;transition:color .2s}
.forgot:hover{color:var(--purple2)}

/* SUBMIT */
.btn-submit{
  width:100%;padding:15px;border-radius:12px;margin-top:8px;
  font-family:var(--font-d);font-size:15px;font-weight:700;letter-spacing:.01em;
  color:#fff;background:linear-gradient(135deg,var(--purple),#9B4FD8);
  border:1px solid rgba(155,111,250,.4);cursor:pointer;
  box-shadow:0 0 30px rgba(124,58,237,.35);transition:all .2s
}
.btn-submit:hover{box-shadow:0 0 50px rgba(124,58,237,.55);transform:translateY(-1px)}
.btn-submit:active{transform:none}

/* TERMS */
.terms{text-align:center;font-size:12px;color:var(--muted);margin-top:20px;line-height:1.6}
.terms a{color:var(--muted2);transition:color .2s}
.terms a:hover{color:var(--white)}

/* HIDDEN */
.hidden{display:none!important}

/* ERROR / SUCCESS messages */
.msg{
  padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none
}
.msg.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#FCA5A5}
.msg.success{background:rgba(0,196,212,.08);border:1px solid rgba(0,196,212,.2);color:var(--cyan)}
.msg.show{display:block}

@media(max-width:480px){
  .auth-card{padding:32px 24px;border-radius:16px}
  .nav{padding:0 20px}
}
</style>
</head>
<body>

<canvas id="pc"></canvas>

<nav class="nav">
  <a href="/" class="logo">VKatOS</a>
  <div class="nav-r" id="nav-toggle">
    Don't have an account? <a href="#" id="switch-link">Sign up free →</a>
  </div>
</nav>

<main>
  <div class="auth-card">
    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" id="tab-in" onclick="setMode('signin')">Sign in</button>
      <button class="tab" id="tab-up" onclick="setMode('signup')">Sign up</button>
    </div>

    <!-- DYNAMIC HEADING -->
    <div class="auth-h" id="auth-h">Welcome back</div>
    <div class="auth-sub" id="auth-sub">Sign in to your vkatos account to access AetherOS and DCSP.</div>

    <!-- MESSAGE -->
    <div class="msg" id="msg"></div>

    <!-- OAUTH -->
    <button class="oauth-btn" onclick="oauthLogin('google')">
      <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      <span id="google-btn-text">Continue with Google</span>
    </button>
    <button class="oauth-btn" onclick="oauthLogin('github')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
      <span id="github-btn-text">Continue with GitHub</span>
    </button>

    <div class="divider">or</div>

    <!-- FORM -->
    <form id="auth-form" onsubmit="handleSubmit(event)">
      <div class="field" id="field-name" style="display:none">
        <label>Full name</label>
        <input type="text" id="name" placeholder="Your name" autocomplete="name"/>
      </div>
      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@company.com" autocomplete="email" required/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required minlength="8"/>
        <a href="#" class="forgot" id="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">Sign in to vkatos →</button>
    </form>

    <div class="terms">
      By continuing, you agree to our <a href="/terms/">Terms of Service</a> and <a href="/privacy/">Privacy Policy</a>.
    </div>
  </div>
</main>

<script>
/* PARTICLE BG */
(function(){
  const c=document.getElementById('pc'),ctx=c.getContext('2d');
  let W,H,pts;const N=60,D=120;
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
  function mk(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.2+.4,a:Math.random()*.4+.2}}
  function init(){resize();pts=Array.from({length:N},mk)}
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<D){ctx.strokeStyle=`rgba(124,58,237,${(1-d/D)*.12})`;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke()}
    }
    pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(155,111,250,${p.a})`;ctx.fill()});
    requestAnimationFrame(draw)
  }
  window.addEventListener('resize',resize);init();draw();
})();

/* MODE SWITCHING */
let mode='signin';
function setMode(m){
  mode=m;
  const isIn=m==='signin';
  document.getElementById('tab-in').classList.toggle('active',isIn);
  document.getElementById('tab-up').classList.toggle('active',!isIn);
  document.getElementById('auth-h').textContent=isIn?'Welcome back':'Create your account';
  document.getElementById('auth-sub').textContent=isIn
    ?'Sign in to your vkatos account to access AetherOS and DCSP.'
    :'Join thousands of engineers building faster with vkatos.';
  document.getElementById('field-name').style.display=isIn?'none':'block';
  document.getElementById('forgot-link').style.display=isIn?'block':'none';
  document.getElementById('submit-btn').textContent=isIn?'Sign in to vkatos →':'Create account →';
  document.getElementById('google-btn-text').textContent=isIn?'Continue with Google':'Sign up with Google';
  document.getElementById('github-btn-text').textContent=isIn?'Continue with GitHub':'Sign up with GitHub';
  document.getElementById('switch-link').textContent=isIn?'Sign up free →':'Sign in instead →';
  document.getElementById('nav-toggle').innerHTML=isIn
    ?`Don't have an account? <a href="#" id="switch-link" onclick="setMode('signup');return false">Sign up free →</a>`
    :`Already have an account? <a href="#" id="switch-link" onclick="setMode('signin');return false">Sign in →</a>`;
  hideMsg();
}

document.getElementById('switch-link').addEventListener('click',function(e){
  e.preventDefault();setMode(mode==='signin'?'signup':'signin');
});

/* Read ?mode= from URL */
const urlMode=new URLSearchParams(location.search).get('mode');
if(urlMode==='signup')setMode('signup');

/* SHOW / HIDE MSG */
function showMsg(text,type){
  const el=document.getElementById('msg');
  el.textContent=text;el.className='msg '+type+' show';
}
function hideMsg(){document.getElementById('msg').className='msg'}

/* OAUTH */
function oauthLogin(provider){
  showMsg(`Redirecting to ${provider === 'google' ? 'Google' : 'GitHub'}...`, 'success');
  setTimeout(() => {
    window.location.href = provider === 'google'
      ? 'https://app.vkatos.com/api/auth/oauth/google'
      : 'https://app.vkatos.com/api/auth/oauth/github';
  }, 400);
}

/* EMAIL AUTH */
async function handleSubmit(e){
  e.preventDefault();
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  const name = document.getElementById('name').value || email.split('@')[0];
  if(pass.length < 8){ showMsg('Password must be at least 8 characters.', 'error'); return; }
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Authenticating…'; btn.disabled = true;
  hideMsg();
  try {
    const endpoint = mode === 'signin'
      ? 'https://app.vkatos.com/api/auth/login'
      : 'https://app.vkatos.com/api/auth/register';
    const body = mode === 'signin'
      ? { email, password: pass }
      : { email, password: pass, name };
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!res.ok){
      throw new Error(data.detail || 'Authentication failed. Please try again.');
    }
    if(data.access_token) localStorage.setItem('vk_token', data.access_token);
    showMsg(mode === 'signin' ? 'Signed in! Redirecting…' : 'Account created! Redirecting…', 'success');
    setTimeout(() => { window.location.href = 'https://app.vkatos.com'; }, 700);
  } catch(err){
    showMsg(err.message, 'error');
    btn.textContent = mode === 'signin' ? 'Sign in to vkatos →' : 'Create account →';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
