<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Redirecting to VKatOS Portal…</title>
<meta http-equiv="refresh" content="2;url=https://app.vkatos.com"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #07070F;
  --purple: #7C3AED;
  --purple2: #9B6FFA;
  --cyan: #00C4D4;
  --white: #F0F0FF;
  --muted: #5A5A7A;
  --border: rgba(124,58,237,0.18);
  --font-d: 'Syne', sans-serif;
  --font-b: 'DM Sans', sans-serif;
  --font-m: 'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-b);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 100vh;
}
a { text-decoration: none; color: inherit; }

.logo {
  font-family: var(--font-d);
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--white) 30%, var(--purple2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 48px;
}

.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 56px 64px;
  max-width: 480px;
  width: 90%;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(124,58,237,0.15), transparent);
  top: -100px; right: -80px;
  pointer-events: none;
}

.spinner {
  width: 44px; height: 44px;
  border: 2px solid rgba(124,58,237,0.2);
  border-top-color: var(--purple2);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  margin: 0 auto 32px;
}
@keyframes spin { to { transform: rotate(360deg); } }

h1 {
  font-family: var(--font-d);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
  color: var(--white);
}
p {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 32px;
}

.direct-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-d);
  font-size: 13px;
  font-weight: 700;
  color: var(--white);
  background: var(--purple);
  border: 1px solid rgba(155,111,250,0.4);
  border-radius: 10px;
  padding: 12px 28px;
  box-shadow: 0 0 30px rgba(124,58,237,0.35);
  transition: all 0.2s;
}
.direct-link:hover {
  background: var(--purple2);
  box-shadow: 0 0 50px rgba(124,58,237,0.5);
  transform: translateY(-1px);
}

.note {
  margin-top: 20px;
  font-family: var(--font-m);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.05em;
}
</style>
</head>
<body>

<a href="/" class="logo">VKatOS</a>

<div class="card">
  <div class="spinner"></div>
  <h1>Redirecting to your portal…</h1>
  <p>You are being redirected to the VKatOS client portal. This will happen automatically in a moment.</p>
  <a href="https://app.vkatos.com" class="direct-link">Go to portal now →</a>
  <div class="note">app.vkatos.com</div>
</div>

<script>
  // Immediate JS redirect as fallback — meta refresh handles most cases
  setTimeout(function() {
    window.location.href = 'https://app.vkatos.com';
  }, 1500);
</script>
</body>
</html>
