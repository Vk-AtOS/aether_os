apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dcsp-ingress
  namespace: dcsp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: dcsp.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dcsp-service
            port:
              number: 80
