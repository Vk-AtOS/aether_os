version: '3.9'

services:
  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://dcsp_user:dcsp2024@db:5432/dcsp_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-false}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-dcsp2024}
      - DCSP_ADMIN_PASSWORD=${DCSP_ADMIN_PASSWORD:-dcsp2024}
      - DCSP_ADMIN_EMAIL=${DCSP_ADMIN_EMAIL:-admin@dcsp.local}
      - DCSP_DEMO_PASSWORD=${DCSP_DEMO_PASSWORD:-demo123}
      - DCSP_DEMO_EMAIL=${DCSP_DEMO_EMAIL:-demo@dcsp.local}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
      - STRIPE_ENTERPRISE_PRICE_ID=${STRIPE_ENTERPRISE_PRICE_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY_PATH=/app/dcsp-github-app.pem
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG:-dcsp-autofix}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./dcsp-github-app.pem:/app/dcsp-github-app.pem:ro

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dcsp_db
      POSTGRES_USER: dcsp_user
      POSTGRES_PASSWORD: dcsp2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcsp_user -d dcsp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RQ worker — processes repair jobs asynchronously
  worker:
    build: .
    command: ["python", "-m", "rq", "worker", "--url", "redis://redis:6379/0", "repairs"]
    environment:
      - DATABASE_URL=postgresql://dcsp_user:dcsp2024@db:5432/dcsp_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
