version: "3.9"

# AetherOS — Staging stack
# Runs alongside production on the same host using different ports and volumes.
# Reads configuration from .env.staging (create from .env.staging.example).
#
# Start:  bash deploy/staging-deploy.sh
# Stop:   docker-compose -f docker-compose.staging.yml down
# Wipe:   docker-compose -f docker-compose.staging.yml down -v

services:
  # ── PostgreSQL (staging) ────────────────────────────────────────────────────
  db_staging:
    container_name: aetheros_db_staging
    # PostgreSQL 15 with the pgvector extension: the schema has a vector column (core/models.py ArtifactEmbedding), so a
    # plain postgres image cannot create it. Same image CI tests against. An existing volume made by postgres:15-alpine
    # (musl) needs `REINDEX DATABASE` after the switch to this Debian (glibc) image: text collation order differs.
    image: pgvector/pgvector:pg15@sha256:e0b617fffc06dd37323ee99873c7a8683f19f1dce34633670262b0113ce32638
    restart: unless-stopped
    env_file: .env.staging
    environment:
      POSTGRES_DB: aether_os_staging
      POSTGRES_USER: aether_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether_user -d aether_os_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (staging) ─────────────────────────────────────────────────────────
  redis_staging:
    container_name: aetheros_redis_staging
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    env_file: .env.staging
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - set a strong random password}
    volumes:
      - staging_redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Schema migrations (staging): one-shot, runs before the API ──────────────
  migrate_staging:
    container_name: aetheros_migrate_staging
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    working_dir: /srv/aether_os
    command: ["python", "scripts/db_migrate.py"]
    environment:
      DATABASE_URL: postgresql://aether_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db_staging:5432/aether_os_staging
      AETHER_FIELD_KEY: ${AETHER_FIELD_KEY:?AETHER_FIELD_KEY is required for migrations}
    depends_on:
      db_staging:
        condition: service_healthy

  # ── AetherOS API (staging) ──────────────────────────────────────────────────
  api_staging:
    container_name: aetheros_api_staging
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.staging
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql://aether_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db_staging:5432/aether_os_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis_staging:6379/0
      REQUIRE_REDIS: "true"
      ENVIRONMENT: staging
      # RS256 JWT keys (recommended) — set these to enable asymmetric signing
      AETHER_JWT_PRIVATE_KEY_B64: ${AETHER_JWT_PRIVATE_KEY_B64:-}
      AETHER_JWT_PUBLIC_KEY_B64: ${AETHER_JWT_PUBLIC_KEY_B64:-}
      # HS256 fallback — used only if RS256 keys above are not set
      AETHER_SECRET_KEY: ${AETHER_SECRET_KEY:-}
      AETHER_ONE_ZT_SECRET: ${AETHER_ONE_ZT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Any OpenAI-compatible endpoint (e.g. NVIDIA https://integrate.api.nvidia.com/v1); model names are that provider's.
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      OPENROUTER_HEAVY_MODEL: ${OPENROUTER_HEAVY_MODEL:-}
      OPENROUTER_LIGHT_MODEL: ${OPENROUTER_LIGHT_MODEL:-}
      OPENROUTER_COUNCIL_MODELS: ${OPENROUTER_COUNCIL_MODELS:-}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-25}
      OPENROUTER_EXTRA_BODY: ${OPENROUTER_EXTRA_BODY:-}   # provider switches, e.g. Nemotron thinking off (see .env.example)
      # Free/community model pools may log what they receive: off unless the operator opts in (restricted data never goes).
      ALLOW_COMMUNITY_LLM: ${ALLOW_COMMUNITY_LLM:-}
      PRIMARY_LLM: ${PRIMARY_LLM:-anthropic}
      BEDROCK_ENABLED: ${BEDROCK_ENABLED:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BEDROCK_MODEL_HEAVY: ${BEDROCK_MODEL_HEAVY:-au.anthropic.claude-sonnet-4-6}
      BEDROCK_MODEL_LIGHT: ${BEDROCK_MODEL_LIGHT:-amazon.nova-lite-v1:0}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required - set to https://yourdomain.com}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required - set to https://yourdomain.com/dashboard}
      SAML_SP_ENTITY_ID: ${SAML_SP_ENTITY_ID:-}
      SAML_SP_ACS_URL: ${SAML_SP_ACS_URL:-}
      # OAuth2 Social Login
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # SAML SSO IdP configuration
      SAML_IDP_ENTITY_ID: ${SAML_IDP_ENTITY_ID:-}
      SAML_IDP_SSO_URL: ${SAML_IDP_SSO_URL:-}
      SAML_IDP_CERT: ${SAML_IDP_CERT:-}
      # Field-level encryption key
      AETHER_FIELD_KEY: ${AETHER_FIELD_KEY:-}
      # Error tracking
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Admin account created on first startup
      # INFRA-H2: standardised to AETHER_ADMIN_PASS — matches core/seed.py
      AETHER_ADMIN_EMAIL: ${AETHER_ADMIN_EMAIL:-admin@example.com}
      AETHER_ADMIN_PASS: ${AETHER_ADMIN_PASS:?AETHER_ADMIN_PASS must be set in .env.staging}
    depends_on:
      migrate_staging:
        condition: service_completed_successfully
      db_staging:
        condition: service_healthy
      redis_staging:
        condition: service_healthy
    volumes:
      - staging_aether_os_data:/home/aether/.aether_os
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  staging_pg_data:
  staging_redis_data:
  staging_aether_os_data:
